# The function-like macros of ISO C17 that a function cannot stand in for: they
# take a type or a member name, declare, or act at the call site. They stay
# macros: include/mwrap/libc/macros.hpp includes the headers that define them.
[function-like]
"assert.h" = ["assert"]
"setjmp.h" = ["setjmp"]
"stdarg.h" = ["va_arg", "va_copy", "va_end", "va_start"]
"stddef.h" = ["offsetof"]
"stdint.h" = ["INT8_C", "INT16_C", "INT32_C", "INT64_C", "UINT8_C", "UINT16_C", "UINT32_C", "UINT64_C",
              "INTMAX_C", "UINTMAX_C"]

# ISO C macros that this package does not offer, and why.
[not-offered]
NULL = "C++ has nullptr"
"complex.h, tgmath.h" = "the C++ headers of these names are not C's: std::complex and the overloads of <cmath>"
"iso646.h, stdalign.h, stdbool.h, stdnoreturn.h" = "their macros spell C++ keywords and attributes"
"stdatomic.h, threads.h" = "C++ has std::atomic and std::thread; C++23's <stdatomic.h> is a C++ header"
"math.h classification and comparison" = "fpclassify, isfinite, isinf, isnan, isnormal, signbit, isgreater … are functions of <cmath> in C++"
"__STDC_*" = "predefined by the compiler, not by a header"
"Annex K" = "the bounds-checking interfaces are optional, and the C libraries this package targets do not provide them"
